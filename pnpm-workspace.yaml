packages:
  - apps/*
  - packages/*
  - packages/contexts/*
  - packages/platform/*

confirmModulesPurge: false

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  husky: true
  msgpackr-extract: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
